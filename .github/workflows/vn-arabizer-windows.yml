name: VN Arabizer – Windows build

on:
  push:
    paths:
      - "vn-arabizer/**"
      - ".github/workflows/vn-arabizer-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vn-arabizer
        shell: pwsh
    env:
      VNARABIZER_HOME: ${{ github.workspace }}\vna-home
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Real RPG Maker XP / VX / VX Ace archives (sample projects from RPGMakerDecrypter, MIT)
        run: |
          $base = "https://raw.githubusercontent.com/uuksu/RPGMakerDecrypter/465c88c304cac0b1516a3fbfb0b2a87fb0517736/RPGMakerDecrypter.Tests/EncryptedArchives"
          $dir = "$env:RUNNER_TEMP\rgss"
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($f in "Game.rgss3a", "Game.rgss2a", "Game.rgssad") { Invoke-WebRequest "$base/$f" -OutFile "$dir\$f" }
          python tools/check_rgss_real.py "$dir\Game.rgss3a" "$dir\Game.rgss2a" "$dir\Game.rgssad"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Real Anim / Crowd script files (decrypted samples documented by FEW_Engine)
        run: |
          $base = "https://raw.githubusercontent.com/TheVNConnoisseur/FEW_Engine/bdff8f335d07e9978233ef1a56f314e57106dda1/Investigation"
          $dir = "$env:RUNNER_TEMP\anim"
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($f in "zet_sce.dat", "zet_define.dat") { Invoke-WebRequest "$base/$f" -OutFile "$dir\$f" }
          python tools/check_anim_real.py "$dir\zet_sce.dat" "$dir\zet_define.dat"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Cache bundled tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: vn-arabizer/vnarabizer/assets/tools
          key: tools-${{ hashFiles('vn-arabizer/packaging/build_tools.ps1') }}

      - name: Build VNTextPatch, VNTextProxy and KirikiriTools from source
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: ./packaging/build_tools.ps1

      - name: Build app folder
        run: pyinstaller packaging/vnarabizer.spec --noconfirm

      - name: Self-test of the built app
        run: |
          .\dist\VNArabizer\vnarabizer-cli.exe selftest | Tee-Object -Variable st
          if ($LASTEXITCODE -ne 0 -or ($st -match "MISSING")) { exit 1 }
          Get-Item vnarabizer\assets\tools\SiglusKey\siglus-static-key-tool.exe

      - name: Cache offline model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vna-home\models
          key: nllb-600m-v1

      - name: Download NLLB model and translate test sentences
        run: |
          .\dist\VNArabizer\vnarabizer-cli.exe download-model nllb-600m
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\VNArabizer\vnarabizer-cli.exe test-translate "The sun was setting over the quiet town." --source en --model nllb-600m
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\VNArabizer\vnarabizer-cli.exe test-translate "今日はいい天気ですね。一緒に帰りませんか？" --source ja --model nllb-600m
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: GPU libraries download and load (runner has no GPU; informational)
        continue-on-error: true
        run: |
          .\dist\VNArabizer\vnarabizer-cli.exe download-gpu
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Translate a demo Ren'Py game end to end
        run: |
          python tools/make_demo_game.py "$env:RUNNER_TEMP\DemoGame"
          .\dist\VNArabizer\vnarabizer-cli.exe translate "$env:RUNNER_TEMP\DemoGame" --engine nllb --model nllb-600m --source en --apply
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content "$env:RUNNER_TEMP\DemoGame\game\vnarabizer\say.json" -Encoding utf8
          Get-Content "$env:RUNNER_TEMP\DemoGame\game\tl\arabic\vnarabizer_strings.rpy" -Encoding utf8
          if (-not (Test-Path "$env:RUNNER_TEMP\DemoGame\game\zz_vnarabizer.rpy")) { exit 1 }

      - name: Translate a demo RPG Maker MV game end to end
        run: |
          python tools/make_demo_game.py "$env:RUNNER_TEMP\RpgDemo" mv
          .\dist\VNArabizer\vnarabizer-cli.exe translate "$env:RUNNER_TEMP\RpgDemo" --engine nllb --model nllb-600m --source ja --apply
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "import json,sys; m=json.load(open(sys.argv[1],encoding='utf-8')); print('\n'.join(c['parameters'][0] for c in m['events'][1]['pages'][0]['list'] if c['code']==401))" "$env:RUNNER_TEMP\RpgDemo\www\data\Map001.json"
          Get-Content "$env:RUNNER_TEMP\RpgDemo\www\js\plugins.js" -Tail 1
          .\dist\VNArabizer\vnarabizer-cli.exe remove "$env:RUNNER_TEMP\RpgDemo"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Translate a demo Twine (SugarCube) game end to end
        run: |
          python tools/make_demo_game.py "$env:RUNNER_TEMP\TwineDemo" sugarcube
          .\dist\VNArabizer\vnarabizer-cli.exe translate "$env:RUNNER_TEMP\TwineDemo" --engine nllb --model nllb-600m --source en --apply
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "import html,re,sys; d=open(sys.argv[1],encoding='utf-8').read(); print(html.unescape(re.search(r'name=.Start.[^>]*>(.*?)</tw-passagedata>', d, re.S).group(1)))" "$env:RUNNER_TEMP\TwineDemo\Test Game.html"
          .\dist\VNArabizer\vnarabizer-cli.exe remove "$env:RUNNER_TEMP\TwineDemo"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Translate a demo CatSystem2 game end to end (real VNTextPatch)
        run: |
          python tools/make_demo_game.py "$env:RUNNER_TEMP\Cs2Demo" cs2
          .\dist\VNArabizer\vnarabizer-cli.exe translate "$env:RUNNER_TEMP\Cs2Demo" --engine nllb --model nllb-600m --source ja --apply
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/show_patched.py "$env:RUNNER_TEMP\Cs2Demo\scene.int"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem "$env:RUNNER_TEMP\Cs2Demo"
          .\dist\VNArabizer\vnarabizer-cli.exe remove "$env:RUNNER_TEMP\Cs2Demo"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Translate a demo KiriKiri game end to end (real VNTextPatch)
        run: |
          python tools/make_demo_game.py "$env:RUNNER_TEMP\KrkrDemo" krkr
          .\dist\VNArabizer\vnarabizer-cli.exe translate "$env:RUNNER_TEMP\KrkrDemo" --engine nllb --model nllb-600m --source ja --apply
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/show_patched.py "$env:RUNNER_TEMP\KrkrDemo\patch.xp3"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\VNArabizer\vnarabizer-cli.exe remove "$env:RUNNER_TEMP\KrkrDemo"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Translate a demo RPG Maker VX Ace game (Game.rgss3a) end to end
        run: |
          python tools/make_demo_game.py "$env:RUNNER_TEMP\VxaDemo" vxace
          .\dist\VNArabizer\vnarabizer-cli.exe translate "$env:RUNNER_TEMP\VxaDemo" --engine nllb --model nllb-600m --source ja --apply
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "import sys; sys.path.insert(0,'.'); from vnarabizer.archives.rgss import RgssArchive; from vnarabizer.archives.rmarshal import loads; a=RgssArchive(sys.argv[1]); m=loads(a.read('Data/Map001.rvdata2')); print('\n'.join(c.get('@parameters').items[0].text for c in m.get('@events').pairs[0][1].get('@pages').items[0].get('@list').items if c.get('@code')==401))" "$env:RUNNER_TEMP\VxaDemo\Game.rgss3a"
          if (-not (Test-Path "$env:RUNNER_TEMP\VxaDemo\Fonts\VN Arabic.ttf")) { exit 1 }
          .\dist\VNArabizer\vnarabizer-cli.exe remove "$env:RUNNER_TEMP\VxaDemo"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Translate demo NScripter (nscript.dat) and Siglus (Scene.pck) games end to end
        run: |
          python tools/make_demo_game.py "$env:RUNNER_TEMP\NsDemo" nscripter
          .\dist\VNArabizer\vnarabizer-cli.exe translate "$env:RUNNER_TEMP\NsDemo" --engine nllb --model nllb-600m --source ja --apply
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\VNArabizer\vnarabizer-cli.exe remove "$env:RUNNER_TEMP\NsDemo"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/make_demo_game.py "$env:RUNNER_TEMP\SgDemo" siglus
          .\dist\VNArabizer\vnarabizer-cli.exe translate "$env:RUNNER_TEMP\SgDemo" --engine nllb --model nllb-600m --source ja --apply
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "import sys; sys.path.insert(0,'.'); from vnarabizer.archives.siglus import ScenePck; p=ScenePck(open(sys.argv[1],'rb').read()); print('\n'.join(s for sc in p.scenes for s in sc.strings))" "$env:RUNNER_TEMP\SgDemo\Scene.pck"
          .\dist\VNArabizer\vnarabizer-cli.exe remove "$env:RUNNER_TEMP\SgDemo"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Translate a demo Anim / Crowd game (*_sce.dat) end to end
        run: |
          python tools/make_demo_game.py "$env:RUNNER_TEMP\AnimDemo" anim
          .\dist\VNArabizer\vnarabizer-cli.exe translate "$env:RUNNER_TEMP\AnimDemo" --engine nllb --model nllb-600m --source ja --apply
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/show_patched.py "$env:RUNNER_TEMP\AnimDemo\zz_sce.dat"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\VNArabizer\vnarabizer-cli.exe remove "$env:RUNNER_TEMP\AnimDemo"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build installer
        run: |
          $ver = python -c "import vnarabizer; print(vnarabizer.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist\*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: VNArabizer-Setup
          path: vn-arabizer/dist/VNArabizer-Setup-*.exe
          if-no-files-found: error
